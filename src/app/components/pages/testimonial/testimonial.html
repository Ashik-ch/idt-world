<section class="relative bg-gradient-to-b from-white via-red-50/30 to-white py-24 overflow-hidden">
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-[420px] h-[420px]
             bg-red-200 rounded-full blur-[120px] opacity-40"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px]
             bg-red-100 rounded-full blur-[140px] opacity-50"></div>
    </div>

    <div class="relative container mx-auto px-6 md:px-12 z-10">

        <!-- Header -->
        <div class="text-center max-w-3xl mx-auto mb-20" data-aos="fade-up">

            <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full
                 bg-red-50 border border-red-200
                 text-red-600 text-xs font-bold uppercase tracking-[0.2em] mb-6">

                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                Traveler Stories
            </div>
            <h2 class="text-3xl md:text-5xl font-bold text-gray-900 mb-6 leading-tight">
                What
                <span class="bg-gradient-to-r from-red-600 via-red-500 to-red-400
                     bg-clip-text text-transparent">
                    Our Travelers Say
                </span>
            </h2>

            <p class="text-gray-600 text-lg md:text-xl leading-relaxed">
                Discover unforgettable journeys and authentic experiences shared by travelers who explored with us.
            </p>
        </div>

        <!-- Cards -->
        <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3 items-start">

            <div *ngFor="let t of testimonials; let i=index" data-aos="fade-up" [attr.data-aos-delay]="i*150" class="group relative bg-white border border-red-100
                rounded-3xl p-8 overflow-hidden
                shadow-lg hover:shadow-[0_20px_45px_rgba(239,68,68,0.18)]
                transition-all duration-500 hover:-translate-y-2">

                <!-- Hover Glow -->
                <div class="absolute inset-0 opacity-0 group-hover:opacity-100
                     bg-gradient-to-br from-red-50 via-transparent to-red-100
                     transition duration-500">
                </div>

                <!-- Quote Watermark -->
                <div class="absolute -top-4 -right-4 text-red-100
                     group-hover:text-red-200 transition-all duration-500 rotate-12">

                    <i class="pi pi-quote-right" style="font-size:8rem;"></i>
                </div>

                <!-- Rating -->
                <div class="flex gap-1 text-yellow-500 text-sm mb-6 relative z-10">
                    <ng-container *ngFor="let star of [1,2,3,4,5]; let idx=index">
                        <i class="pi" [ngClass]="idx < t.rating ? 'pi-star-fill' : 'pi-star text-gray-300'">
                        </i>
                    </ng-container>
                </div>

                <!-- Message -->
                <p class="text-gray-700 leading-relaxed text-base mb-8
                   relative z-10 line-clamp-5
                   group-hover:text-gray-900 transition">

                    "{{ t.message }}"
                </p>

                <!-- Divider -->
                <div class="h-px w-full
                     bg-gradient-to-r
                     from-red-200 via-red-100 to-transparent mb-6">
                </div>

                <!-- Profile -->
                <div class="flex items-center gap-4 relative z-10">

                    <div class="relative">

                        <div class="absolute inset-0
                             bg-red-400 rounded-full blur-md
                             opacity-0 group-hover:opacity-30
                             transition"></div>

                        <img [src]="t.avatar" [alt]="t.name" class="w-14 h-14 rounded-full object-cover
                            border-2 border-red-100
                            group-hover:border-red-400
                            relative z-10 transition" />
                    </div>

                    <div class="flex-1 min-w-0">
                        <h4 class="text-lg font-semibold text-gray-900 truncate">
                            {{ t.name }}
                        </h4>

                        <p class="text-sm text-red-500 truncate">
                            {{ t.location }}
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-2
                         lg:opacity-0 lg:group-hover:opacity-100
                         transition-all duration-300">

                        <!-- Call -->
                        <a [href]="'tel:' + t.contact" class="w-10 h-10 rounded-full
                            bg-red-50 hover:bg-red-500
                            text-red-500 hover:text-white
                            flex items-center justify-center
                            border border-red-200
                            transition-all duration-300" title="Call Now">

                            <i class="pi pi-phone"></i>
                        </a>

                        <!-- WhatsApp -->
                        <a [href]="'https://wa.me/' + t.whatsapp.replace('+','')" target="_blank" rel="noopener" class="w-10 h-10 rounded-full
                            bg-green-50 hover:bg-green-500
                            text-green-600 hover:text-white
                            flex items-center justify-center
                            border border-green-200
                            transition-all duration-300" title="WhatsApp">

                            <i class="pi pi-whatsapp"></i>
                        </a>

                    </div>
                </div>

            </div>

        </div>
    </div>
</section>
