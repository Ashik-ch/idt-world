<section class="ig-feed-section relative py-4 md:py-5 overflow-hidden bg-[#fafafa]">
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-10 left-10 w-72 h-72 bg-red-100 rounded-full blur-[100px] opacity-60"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-rose-100 rounded-full blur-[110px] opacity-50"></div>
  </div>

  <div class="relative container mx-auto px-4 sm:px-6 z-10">
    <!-- Section head -->
    <header class="text-center max-w-2xl mx-auto mb-4 md:mb-5" data-aos="fade-up">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] mb-4 shadow-sm">
         Client Moments
      </div>
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900 mb-3 leading-tight">
        Traveler
        <span class="bg-gradient-to-r from-red-600 via-red-500 to-red-400 bg-clip-text text-transparent">
          Feed
        </span>
      </h2>
     </header>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8 p-8">
       
       <article *ngFor="let post of testimonials; let i = index"
                class="ig-post w-full max-w-[470px] mx-auto"
                data-aos="fade-up"
                [attr.data-aos-delay]="i * 80">
 
         <!-- Post header -->
         <div class="ig-post-header">
           <div class="ig-post-avatar-wrap">
             <img [src]="post.avatar" [alt]="post.name" class="ig-post-avatar" loading="lazy">
           </div>
           <div class="ig-post-meta min-w-0 flex-1">
             <p class="ig-post-name">{{ post.name }}</p>
             <p class="ig-post-location">{{ post.location }}</p>
           </div>
           <span class="ig-post-time">{{ post.postedAt }}</span>
         </div>
 
         <!-- Photo / video -->
         <div class="ig-post-media">
           <video *ngIf="isVideo(post)"
                  class="ig-post-video"
                  [src]="post.mediaUrl"
                  [poster]="post.posterUrl"
                  controls
                  playsinline
                  preload="metadata">
           </video>
           <img *ngIf="!isVideo(post)"
                [src]="post.mediaUrl"
                [alt]="post.name + ' travel moment'"
                class="ig-post-image"
                loading="lazy">
         </div>
 
         <!-- Actions -->
         <div class="ig-post-contact m-3 my-2">
           <a [href]="telHref(post.contact)"
              class="ig-contact-link"
              title="Call {{ post.name }}">
             <i class="pi pi-phone text-xs"></i>
             <span>{{ post.contact }}</span>
           </a>
           <a [href]="whatsappHref(post.whatsapp)"
              target="_blank"
              rel="noopener noreferrer"
              class="ig-contact-link ig-contact-link--wa"
              title="WhatsApp">
             <i class="pi pi-whatsapp"></i>
             <span>WhatsApp</span>
           </a>
         </div>
 
         <!-- Description + contact -->
         <div class="ig-post-body">
           <p class="ig-post-caption">
             <span class="font-semibold text-gray-900">{{ post.name }}</span>
             {{ post.description }}
           </p>
         </div>
         
       </article>
     </div>
   </div>
 </section>
