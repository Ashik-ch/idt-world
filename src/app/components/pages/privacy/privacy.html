<div class="terms-page" id="privacy-top">
  <header class="terms-hero">
    <div class="max-w-7xl mx-auto px-6 py-12 md:py-16 relative">
      <nav aria-label="Breadcrumb" class="flex items-center gap-3 text-sm text-red-100 mb-8">
        <a routerLink="/" class="hover:text-white hover:underline">Home</a>
        <i class="pi pi-angle-right text-xs" aria-hidden="true"></i>
        <span aria-current="page">Privacy Policy</span>
      </nav>
      <h1 class="mt-5 text-4xl md:text-5xl font-bold tracking-tight leading-tight">Privacy Policy</h1>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-10 md:py-14 terms-layout">
    <aside class="terms-sidebar">
      <nav aria-label="Privacy policy sections" class="contents-card">
        <p class="text-xs font-bold uppercase tracking-widest text-red-600 mb-2">Guest policy</p>
        <h2 class="text-lg font-bold text-gray-900 mb-5">On this page</h2>
        <a routerLink="/privacy-policy" fragment="data-privacy"
          class="contents-link block rounded-lg px-3 py-2 text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          Data Privacy
        </a>
        <div class="mt-6 pt-5 border-t border-gray-100">
          <a routerLink="/terms-and-conditions" class="text-sm font-semibold text-red-600 hover:text-red-800">
            Terms &amp; Conditions
          </a>
        </div>
        <div class="mt-6 pt-5 border-t border-gray-100">
          <p class="text-sm text-gray-500 mb-2">Questions about your privacy?</p>
          <a routerLink="/contact"
            class="text-sm font-semibold text-red-600 hover:text-red-800 inline-flex items-center gap-2">
            Contact us <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i>
          </a>
        </div>
      </nav>
    </aside>

    <article class="terms-document" aria-label="IDT privacy policy">
      <section class="policy-section" id="data-privacy" aria-labelledby="data-privacy-title">
        <p class="text-xs font-bold uppercase tracking-widest text-red-600 mb-3">IDT privacy policy</p>
        <h2 id="data-privacy-title" class="text-2xl font-bold text-gray-900 mb-5">Data Privacy</h2>
        @for (paragraph of paragraphs; track $index) {
          <p class="policy-paragraph">{{ paragraph }}</p>
        }
      </section>
      <div class="document-end">
        <a routerLink="/privacy-policy" fragment="privacy-top"
          class="inline-flex items-center gap-2 text-sm font-semibold text-red-600 hover:text-red-800">
          Back to top <i class="pi pi-arrow-up text-xs" aria-hidden="true"></i>
        </a>
      </div>
    </article>
  </div>
</div>
