<!-- Luxury Occasion Vouchers -->
<section class="voucher-page relative min-h-screen overflow-hidden py-6 md:py-10">

    <div class="absolute inset-0 pointer-events-none voucher-grid-overlay"></div>
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-0 left-1/3 w-[600px] h-[600px] voucher-glow-1 rounded-full blur-[130px]"></div>
        <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] voucher-glow-2 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative container mx-auto px-4 sm:px-6 md:px-12 z-10 max-w-2xl">

        <!-- Page head -->
        <header class="text-center mb-3 ">
            <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-white/10 border border-amber-200/30 text-amber-100 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] mb-3 backdrop-blur-md">
                <i class="pi pi-sparkles text-amber-200"></i>
                Luxury Collection
            </div>
            <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-white mb-1 leading-tight tracking-tight">
                Curated Vouchers for Finest Moments
            </h1>
            <p class="text-rose-100/90 text-sm sm:text-base max-w-xl mx-auto leading-relaxed font-light">
                {{ commonDescription }}
            </p>
        </header>

        <!-- Carousel -->
        <div class="voucher-carousel relative"
             (mouseenter)="pauseCarousel()"
             (mouseleave)="resumeCarousel()">

            <div class="voucher-carousel-viewport overflow-hidden rounded-2xl md:rounded-3xl">
                <div class="voucher-carousel-track flex"
                     [style.transform]="carouselTransform"
                     [class.is-paused]="isCarouselPaused">

                    <article *ngFor="let voucher of vouchers; let i = index"
                             class="voucher-carousel-slide voucher-luxury-card relative shrink-0 w-full rounded-2xl md:rounded-3xl overflow-hidden"
                             [class.is-active]="activeIndex === i"
                             [attr.aria-hidden]="activeIndex !== i"
                             [attr.aria-current]="activeIndex === i ? 'true' : null">

                        <div class="flex flex-col">
                            <!-- Photo -->
                            <div class="relative aspect-[16/10] overflow-hidden">
                                <img [src]="voucher.image" [alt]="voucher.title"
                                     class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-rose-950/80 via-rose-900/20 to-transparent"></div>
                            </div>

                            <!-- Title + button -->
                            <div class="p-3 sm:p-2 text-center">
                                <h2 class="text-lg sm:text-xl md:text-2xl font-bold text-white mb-2 leading-tight">
                                    {{ voucher.title }}
                                </h2>

                                <button type="button"
                                        (click)="enquireVoucher(voucher)"
                                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-2  rounded-2xl bg-gradient-to-r from-white to-rose-50 text-rose-800 font-bold text-sm hover:shadow-[0_12px_40px_rgba(255,255,255,0.25)] transition-all duration-300">
                                    <i class="pi pi-whatsapp text-lg"></i>
                                    Enquire via WhatsApp
                                </button>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <!-- Nav arrows -->
            <button type="button"
                    (click)="prevSlide()"
                    class="voucher-carousel-nav voucher-carousel-nav--prev"
                    aria-label="Previous voucher">
                <i class="pi pi-chevron-left"></i>
            </button>
            <button type="button"
                    (click)="nextSlide()"
                    class="voucher-carousel-nav voucher-carousel-nav--next"
                    aria-label="Next voucher">
                <i class="pi pi-chevron-right"></i>
            </button>

            <!-- Dots -->
            <div class="flex items-center justify-center gap-3 mt-6" role="tablist" aria-label="Voucher slides">
                <button *ngFor="let voucher of vouchers; let i = index"
                        type="button"
                        role="tab"
                        [attr.aria-selected]="activeIndex === i"
                        [attr.aria-label]="voucher.title"
                        (click)="goToSlide(i)"
                        class="voucher-carousel-dot"
                        [class.is-active]="activeIndex === i">
                </button>
            </div>
        </div>
    </div>
</section>
