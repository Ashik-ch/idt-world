<!-- Luxury Occasion Vouchers -->
<section class="voucher-page relative min-h-screen overflow-hidden py-6 md:py-10 flex items-center justify-center">

    <div class="absolute inset-0 pointer-events-none voucher-grid-overlay"></div>
    <div class="fixed inset-0 bg-slate-950 overflow-hidden -z-10">
        <img src="assets/images/banner9.jpg" alt="Background"
            class="w-full h-full object-cover opacity-80 brightness-[0.7]" />
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center p-4 sm:p-6 md:p-8" mx-auto px-4 sm:px-6 md:px-12 z-10
        max-w-4xl>

        <header class="text-center mb-8">
            <div
                class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-white/10 border border-white/20 text-amber-200 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] mb-4 backdrop-blur-md shadow-lg">
                <i class="pi pi-sparkles text-amber-300"></i>
                Luxury Collection
            </div>
            <h1
                class="text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-2 leading-tight tracking-tight drop-shadow-sm">
                Curated Vouchers for Finest Moments
            </h1>
            <p class="text-white/80 text-sm sm:text-base max-w-xl mx-auto leading-relaxed font-light">
                {{ commonDescription }}
            </p>
        </header>

        <div class=" relative" (mouseenter)="pauseCarousel()" (mouseleave)="resumeCarousel()">

            <div
                class="voucher-carousel-viewport overflow-hidden rounded-2xl md:rounded-3xl bg-white/10 border border-white/20 backdrop-blur-xl shadow-[0_12px_40px_0_rgba(0,0,0,0.35)]">
                <div class="voucher-carousel-track flex" [style.transform]="carouselTransform"
                    [class.is-paused]="isCarouselPaused">

                    <article *ngFor="let voucher of vouchers; let i = index"
                        class="voucher-carousel-slide voucher-luxury-card relative shrink-0 w-full"
                        [class.is-active]="activeIndex === i" [attr.aria-hidden]="activeIndex !== i"
                        [attr.aria-current]="activeIndex === i ? 'true' : null">

                        <div class="flex flex-col">
                            <div
                                class="relative aspect-[16/10] lg:aspect-[4/2] overflow-hidden rounded-xl md:rounded-2xl border border-white/10 w-full shadow-inner">
                                <img [src]="voucher.image" [alt]="voucher.title" class="w-full h-full object-cover">
                                <div
                                    class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent">
                                </div>
                            </div>

                            <div class="text-center lg:text-left lg:pl-4 flex flex-col justify-center h-full pb-5">
                                <h2
                                    class="text-center text-xl sm:text-2xl md:text-3xl font-bold text-white mb-4 leading-tight drop-shadow-sm">
                                    {{ voucher.title }}
                                </h2>

                                <button type="button" (click)="enquireVoucher(voucher)"
                                    class="align-center w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-xl bg-white/15 border border-white/20 text-white font-semibold text-sm backdrop-blur-md hover:bg-white/25 hover:border-white/40 shadow-md hover:shadow-[0_8px_25px_rgba(255,255,255,0.1)] transition-all duration-300 transform active:scale-[0.98] self-center lg:self-start">
                                    <i class="pi pi-whatsapp text-lg text-emerald-400"></i>
                                    Enquire via WhatsApp
                                </button>
                            </div>

                        </div>
                    </article>

                </div>
            </div>

            <button type="button" (click)="prevSlide()"
                class="voucher-carousel-nav voucher-carousel-nav--prev flex items-center justify-center w-10 h-10 rounded-full bg-white/10 border border-white/20 text-white backdrop-blur-sm hover:bg-white/20 hover:scale-105 transition-all"
                aria-label="Previous voucher">
                <i class="pi pi-chevron-left"></i>
            </button>
            <button type="button" (click)="nextSlide()"
                class="voucher-carousel-nav voucher-carousel-nav--next flex items-center justify-center w-10 h-10 rounded-full bg-white/10 border border-white/20 text-white backdrop-blur-sm hover:bg-white/20 hover:scale-105 transition-all"
                aria-label="Next voucher">
                <i class="pi pi-chevron-right"></i>
            </button>

            <div class="flex items-center justify-center gap-3 mt-6" role="tablist" aria-label="Voucher slides">
                <button *ngFor="let voucher of vouchers; let i = index" type="button" role="tab"
                    [attr.aria-selected]="activeIndex === i" [attr.aria-label]="voucher.title" (click)="goToSlide(i)"
                    class="voucher-carousel-dot w-2.5 h-2.5 rounded-full transition-all duration-300"
                    [ngClass]="activeIndex === i ? 'bg-white w-6' : 'bg-white/30 hover:bg-white/50'">
                </button>
            </div>

        </div>
    </div>
</section>
